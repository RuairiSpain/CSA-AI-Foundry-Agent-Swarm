[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-phase4"
version = "1.0.0"
description = "SAFE Framework Phase 4: Route Writer Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Microsoft CSA Team"}]
dependencies = [
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=safe_core --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py311"]

