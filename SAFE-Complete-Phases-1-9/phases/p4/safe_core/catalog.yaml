# SAFE Unified Agent Catalog — Phase 4
# Categories match interview search terms:
#   supervisor, specialist, aggregator  → supervisor-manager pattern
#   processor                           → fan-out-fan-in + sequential-pipeline
#   splitter, mapper, reducer           → map-reduce pattern

version: "1.0"

agents:

  # ── supervisor-manager: supervisor role ───────────────────────────────────

  - name: loan-supervisor-router
    category: supervisor
    version: "1.0"
    description: Routes loan applications to appropriate specialists
    input_schema:
      type: object
      required: [amount, loan_type, credit_score]
      properties:
        amount: {type: number}
        loan_type: {type: string}
        credit_score: {type: integer}
    output_schema:
      type: object
      required: [loan_type, specialist, amount, credit_score]
      properties:
        loan_type: {type: string}
        specialist: {type: string}
        amount: {type: number}
        credit_score: {type: integer}

  - name: document-triage-router
    category: supervisor
    version: "1.0"
    description: Classifies incoming documents and routes to the appropriate specialist
    input_schema:
      type: object
      required: [document_text, document_type]
      properties:
        document_text: {type: string}
        document_type: {type: string}
    output_schema:
      type: object
      required: [specialist, document_text, document_type]
      properties:
        specialist: {type: string}
        document_text: {type: string}
        document_type: {type: string}

  # ── supervisor-manager: specialist roles ──────────────────────────────────

  - name: loan-specialist-mortgage
    category: specialist
    version: "1.0"
    description: Analyses mortgage loan applications
    input_schema:
      type: object
      required: [amount, credit_score]
      properties:
        amount: {type: number}
        credit_score: {type: integer}
    output_schema:
      type: object
      required: [decision, confidence]
      properties:
        decision: {type: string}
        confidence: {type: number}

  - name: loan-specialist-auto
    category: specialist
    version: "1.0"
    description: Analyses auto loan applications
    input_schema:
      type: object
      required: [amount, credit_score]
      properties:
        amount: {type: number}
        credit_score: {type: integer}
    output_schema:
      type: object
      required: [decision, confidence]
      properties:
        decision: {type: string}
        confidence: {type: number}

  - name: loan-specialist-personal
    category: specialist
    version: "1.0"
    description: Analyses personal loan applications
    input_schema:
      type: object
      required: [amount, credit_score]
      properties:
        amount: {type: number}
        credit_score: {type: integer}
    output_schema:
      type: object
      required: [decision, confidence]
      properties:
        decision: {type: string}
        confidence: {type: number}

  - name: contract-review-specialist
    category: specialist
    version: "1.0"
    description: Reviews contracts for compliance and risk
    input_schema:
      type: object
      required: [document_text, document_type]
      properties:
        document_text: {type: string}
        document_type: {type: string}
    output_schema:
      type: object
      required: [decision, confidence]
      properties:
        decision: {type: string}
        confidence: {type: number}

  - name: invoice-review-specialist
    category: specialist
    version: "1.0"
    description: Reviews invoices for accuracy and approval
    input_schema:
      type: object
      required: [document_text, document_type]
      properties:
        document_text: {type: string}
        document_type: {type: string}
    output_schema:
      type: object
      required: [decision, confidence]
      properties:
        decision: {type: string}
        confidence: {type: number}

  # ── supervisor-manager + fan-out-fan-in: aggregator role ─────────────────

  - name: standard-aggregator
    category: aggregator
    version: "1.0"
    description: Combines decisions from multiple specialist agents
    input_schema:
      type: object
      required: [decisions]
      properties:
        decisions: {type: array}
    output_schema:
      type: object
      required: [final_decision, confidence]
      properties:
        final_decision: {type: string}
        confidence: {type: number}

  - name: fan-in-aggregator
    category: aggregator
    version: "1.0"
    description: Merges parallel worker results into a single combined output
    input_schema:
      type: object
      required: [results]
      properties:
        results: {type: array}
    output_schema:
      type: object
      required: [combined_result, result_count]
      properties:
        combined_result: {type: object}
        result_count: {type: integer}

  # ── fan-out-fan-in + sequential-pipeline: processor role ─────────────────

  - name: document-processor
    category: processor
    version: "1.0"
    description: Pre-processes a document or data payload for parallel workers
    input_schema:
      type: object
      required: [data]
      properties:
        data: {type: object}
    output_schema:
      type: object
      required: [processed_data]
      properties:
        processed_data: {type: object}

  - name: text-enricher
    category: processor
    version: "1.0"
    description: Enriches text with metadata, entity tags, and sentiment scores
    input_schema:
      type: object
      required: [input_data]
      properties:
        input_data: {type: object}
    output_schema:
      type: object
      required: [output_data]
      properties:
        output_data: {type: object}

  - name: data-validator
    category: processor
    version: "1.0"
    description: Validates, cleans, and normalises a data payload
    input_schema:
      type: object
      required: [input_data]
      properties:
        input_data: {type: object}
    output_schema:
      type: object
      required: [output_data]
      properties:
        output_data: {type: object}

  - name: data-formatter
    category: processor
    version: "1.0"
    description: Transforms data into a target format (JSON, CSV, Markdown)
    input_schema:
      type: object
      required: [input_data]
      properties:
        input_data: {type: object}
    output_schema:
      type: object
      required: [output_data]
      properties:
        output_data: {type: object}

  # ── map-reduce: splitter role ─────────────────────────────────────────────

  - name: batch-splitter
    category: splitter
    version: "1.0"
    description: Splits a large dataset into equal-sized chunks for parallel mappers
    input_schema:
      type: object
      required: [data, chunk_size]
      properties:
        data: {type: array}
        chunk_size: {type: integer}
    output_schema:
      type: object
      required: [chunks]
      properties:
        chunks: {type: array}

  - name: document-splitter
    category: splitter
    version: "1.0"
    description: Splits a long document into page or paragraph chunks
    input_schema:
      type: object
      required: [document_text]
      properties:
        document_text: {type: string}
        max_chunk_tokens: {type: integer}
    output_schema:
      type: object
      required: [chunks]
      properties:
        chunks: {type: array}

  # ── map-reduce: mapper role ───────────────────────────────────────────────

  - name: data-mapper
    category: mapper
    version: "1.0"
    description: Applies a transformation to a single data chunk
    input_schema:
      type: object
      required: [data_chunk]
      properties:
        data_chunk: {type: object}
    output_schema:
      type: object
      required: [mapped_result]
      properties:
        mapped_result: {type: object}

  - name: chunk-summarizer
    category: mapper
    version: "1.0"
    description: Summarises a single document chunk — use as the mapper in a summarisation pipeline
    input_schema:
      type: object
      required: [data_chunk]
      properties:
        data_chunk: {type: object}
    output_schema:
      type: object
      required: [mapped_result]
      properties:
        mapped_result: {type: object}

  # ── map-reduce: reducer role ──────────────────────────────────────────────

  - name: data-reducer
    category: reducer
    version: "1.0"
    description: Aggregates all mapped results into a final reduced output
    input_schema:
      type: object
      required: [mapped_results]
      properties:
        mapped_results: {type: array}
    output_schema:
      type: object
      required: [reduced_result]
      properties:
        reduced_result: {type: object}

  - name: summary-combiner
    category: reducer
    version: "1.0"
    description: Combines per-chunk summaries into a single coherent document summary
    input_schema:
      type: object
      required: [mapped_results]
      properties:
        mapped_results: {type: array}
    output_schema:
      type: object
      required: [reduced_result]
      properties:
        reduced_result: {type: object}
