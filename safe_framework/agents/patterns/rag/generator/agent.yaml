name: RAG Generator
version: 1.0
category: retrieval
description: |
  Generates a grounded answer using only the provided context chunks.

contract:
  inputs:
    - name: query
      type: string
      required: true
      description: Original user query
    - name: context_chunks
      type: array
      required: true
      description: Reranked context to ground the answer

  outputs:
    - name: answer
      type: string
      required: true
      description: Grounded answer
    - name: sources_used
      type: array
      required: true
      description: Chunks cited in the answer
    - name: confidence
      type: float
      required: true
      description: Answer confidence based on context quality

metadata:
  author: SAFE Team
  source:
    repository: internal
    license: MIT
  dependencies: []
  requirements:
    python: ">=3.11"
    packages: []
  timeout_seconds: 60

documentation:
  use_cases:
    - Policy Q&A
    - Document-grounded Q&A
    - Data-grounded NL query
  example:
    input: {query: 'policy', context_chunks: []}
    output: {answer: '', confidence: 0.9}
  limitations:
    - See agent.md for details

tags:
  - retrieval

pattern_roles: []
tools: []
