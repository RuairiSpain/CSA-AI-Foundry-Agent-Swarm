name: Event Listener
version: 1.0
category: integration
description: |
  Receives and normalises incoming events from Azure Service Bus, Event Hub, or webhook triggers.

contract:
  inputs:
    - name: event_payload
      type: object
      required: true
      description: Raw event payload from the source
    - name: event_source
      type: string
      required: false
      description: Source system identifier

  outputs:
    - name: event_type
      type: string
      required: true
      description: Normalised event type key
    - name: event_id
      type: string
      required: true
      description: Unique event identifier
    - name: payload
      type: object
      required: true
      description: Normalised event payload
    - name: received_at
      type: string
      required: true
      description: ISO 8601 timestamp

metadata:
  author: SAFE Team
  source:
    repository: internal
    license: MIT
  dependencies: []
  requirements:
    python: ">=3.11"
    packages: []
  timeout_seconds: 60

documentation:
  use_cases:
    - Invoice received event
    - File upload trigger
    - Webhook ingest
    - Queue message processing
  example:
    input: {event_payload: {invoice_id: 'INV-001'}}
    output: {event_type: 'invoice_received', payload: {}}
  limitations:
    - See agent.md for details

tags:
  - integration

pattern_roles: []
tools: []
