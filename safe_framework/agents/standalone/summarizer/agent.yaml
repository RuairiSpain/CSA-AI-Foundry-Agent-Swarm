name: Text Summarizer
version: 1.0
category: processing
description: |
  Generates concise summaries from long documents

contract:
  inputs:
    - name: input_param
      type: object
      required: true
      description: Input data
      schema:
        type: object
        required_fields: [field1]
        field_definitions:
          field1:
            type: string
            description: Field description
  
  outputs:
    - name: output_param
      type: object
      required: true
      description: Output data
      schema:
        type: object
        required_fields: [result]

metadata:
  author: SAFE Team
  source:
    repository: internal
    license: MIT
  dependencies: []
  requirements:
    python: ">=3.11"
    packages: []
  timeout_seconds: 60

documentation:
  use_cases:
    - Use case 1
    - Use case 2
  example:
    input: {field1: "example"}
    output: {result: "example"}
  limitations:
    - Limitation 1

tags:
  - processing

pattern_roles: []
tools:
  - id: iq-foundry
    purpose: "Retrieve source documents to summarise from the knowledge index"
  - id: iq-work
    purpose: "Summarise M365 content — meeting transcripts, email threads, documents"
  - id: iq-fabric
    purpose: "Summarise data reports and Power BI datasets"
skills:
  - id: summarize-text
    purpose: "Core summarisation operation — produces abstractive prose, bullets, or tl;dr"
  - id: score-sentiment
    purpose: "Tag the emotional tone of the source before summarising to preserve sentiment in output"
  - id: format-markdown
    purpose: "Render the final summary with structured headings when the consumer expects Markdown"

