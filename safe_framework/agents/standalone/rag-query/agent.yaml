name: RAG Query Agent
version: 1.0
category: retrieval
description: |
  Vector-based retrieval-augmented generation for Q&A

contract:
  inputs:
    - name: input_param
      type: object
      required: true
      description: Input data
      schema:
        type: object
        required_fields: [field1]
        field_definitions:
          field1:
            type: string
            description: Field description
  
  outputs:
    - name: output_param
      type: object
      required: true
      description: Output data
      schema:
        type: object
        required_fields: [result]

metadata:
  author: SAFE Team
  source:
    repository: internal
    license: MIT
  dependencies: []
  requirements:
    python: ">=3.11"
    packages: []
  timeout_seconds: 60

documentation:
  use_cases:
    - Use case 1
    - Use case 2
  example:
    input: {field1: "example"}
    output: {result: "example"}
  limitations:
    - Limitation 1

tags:
  - retrieval

pattern_roles: []
tools:
  - id: iq-foundry
    purpose: "Primary — indexes org docs via Azure AI Search; core function of this agent"
  - id: iq-work
    purpose: "Extend retrieval to M365 content (meetings, emails, Teams chats)"
  - id: iq-fabric
    purpose: "Extend retrieval to structured business data in OneLake / Power BI"
  - id: iq-web
    purpose: "Fallback or augmentation when internal knowledge is insufficient"
  - id: azure-cosmos-db
    purpose: "Vector search over operational / transactional data"

