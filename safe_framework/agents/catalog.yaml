    description: Generates formatted Word documents from structured data
    
    contract:
      inputs: [data_object]
      outputs: [document_bytes]
    
    use_cases:
      - Creating client reports
      - Generating contracts
      - Building document templates
    
    metadata:
      author: SAFE Team
      license: MIT
      dependencies: []
      requirements:
        python: ">=3.11"
        packages:
          - python-docx >= 0.8.10
          - pandas >= 1.0
      timeout_seconds: 120
    
    discovery:
      keywords: [document, word, generation, export]
      complexity: intermediate
