name: Frozen File Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  freeze-check:
    name: Check frozen files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes to frozen files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'freeze-override') }}
        run: |
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD")

          # Files / glob patterns that require admin sign-off
          FROZEN_PATTERNS=(
            "safe_framework/safe_core/models.py"
            "safe_framework/safe_core/patterns.py"
            "safe_framework/safe_core/catalog.yaml"
            "safe_framework/agents/catalog.yaml"
            "safe_framework/tools/catalog.yaml"
            "safe_framework/safe_core/validator.py"
            "safe_framework/safe_core/agent_validation.py"
            "safe_framework/pyproject.toml"
            "pyproject.toml"
            "CLAUDE.md"
            ".github/CODEOWNERS"
            ".github/workflows/"
          )

          HITS=()
          for pattern in "${FROZEN_PATTERNS[@]}"; do
            # Match exact file or path prefix (for directory patterns ending in /)
            while IFS= read -r file; do
              if [[ "$file" == "$pattern"* ]] || [[ "$file" == "$pattern" ]]; then
                HITS+=("$file")
              fi
            done <<< "$CHANGED"
          done

          if [ ${#HITS[@]} -eq 0 ]; then
            echo "No frozen files modified. ✓"
            exit 0
          fi

          echo "Frozen files modified in this PR:"
          for f in "${HITS[@]}"; do
            echo "  • $f"
          done

          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo ""
            echo "freeze-override label is present — admin has approved these changes. ✓"
            exit 0
          fi

          echo ""
          echo "These files are frozen and require admin approval."
          echo "An admin must add the 'freeze-override' label to this PR to unblock merge."
          echo ""
          echo "Alternatively, the file owner listed in .github/CODEOWNERS must approve the PR."
          exit 1
